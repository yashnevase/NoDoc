[package]
name = "nodoc-desktop"
version = "0.1.0"
description = "NoDoc desktop shell"
authors = ["yashnevase"]
edition = "2021"

[lib]
name = "nodoc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
